name: Android Production Release & Signing

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build, Sign & Release Android APK & AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Capacitor & Android (Leanback)
        run: |
          node scripts/prepare-android-tv.mjs

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Decode Android Keystore Secret
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ env.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/alo-mae-release.jks

      - name: Build Signed Release APK & AAB
        env:
          ANDROID_KEYSTORE_PATH: "alo-mae-release.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Cleanup Keystore Credentials
        if: always()
        run: |
          rm -f android/app/alo-mae-release.jks

      - name: Prepare & Hash Release Artifacts
        run: |
          mkdir -p release-artifacts
          
          # Find and copy generated APK
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/alo-mae-release.apk \;
          
          # Find and copy generated AAB
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-artifacts/alo-mae-release.aab \;
          
          # Generate SHA256 Checksums
          cd release-artifacts
          sha256sum alo-mae-release.apk alo-mae-release.aab > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-mae-release
          path: release-artifacts/alo-mae-release.apk
          if-no-files-found: warn

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-mae-bundle
          path: release-artifacts/alo-mae-release.aab
          if-no-files-found: warn

      - name: Upload SHA256 Checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: release-artifacts/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Attach Assets to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/alo-mae-release.apk
            release-artifacts/alo-mae-release.aab
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
