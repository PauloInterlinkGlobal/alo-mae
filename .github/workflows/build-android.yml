name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug & Unsigned Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npm run typecheck

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Capacitor & Android
        run: node scripts/prepare-android.mjs

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Unsigned Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Copy & Validate Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/alo-mae-debug.apk

          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$RELEASE_APK" ]; then
            RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          fi

          test -f "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/alo-mae-release-unsigned.apk

          ls -lh artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-mae-debug
          path: artifacts/alo-mae-debug.apk
          if-no-files-found: error

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo-mae-release-unsigned
          path: artifacts/alo-mae-release-unsigned.apk
          if-no-files-found: error
