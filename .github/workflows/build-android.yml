name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      # ============================================================
      # 2. Node.js
      # ============================================================

      - name: 🟢 Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # ============================================================
      # 3. Dependências
      # ============================================================

      - name: 📦 Instalar Dependências
        run: npm ci

      # ============================================================
      # 4. Verificar Capacitor
      # ============================================================

      - name: 🔎 Verificar Capacitor
        run: |
          npx cap --version
          node --version
          npm --version

      # ============================================================
      # 5. Build Next.js
      # ============================================================

      - name: 🏗️ Compilar Next.js
        run: |
          echo "Build type: $BUILD_TYPE"
          npm run build

      # ============================================================
      # 6. Verificar Static Export
      # ============================================================

      - name: 🔍 Verificar out/index.html
        run: |
          if [ ! -d "out" ]; then
            echo "❌ ERRO: diretório out/ não foi criado."
            exit 1
          fi

          if [ ! -f "out/index.html" ]; then
            echo "❌ ERRO: out/index.html não encontrado."
            exit 1
          fi

          echo "✅ Static Export encontrado."
          echo "📁 Conteúdo:"
          find out -maxdepth 2 -type f | head -50

      # ============================================================
      # 7. Capacitor Sync
      # ============================================================

      - name: 🔄 Sincronizar Capacitor
        run: |
          npx cap sync android

      # ============================================================
      # 8. Verificar Android
      # ============================================================

      - name: 🔍 Verificar Projeto Android
        run: |
          test -f android/variables.gradle || {
            echo "❌ android/variables.gradle não encontrado"
            exit 1
          }

          test -f android/gradlew || {
            echo "❌ android/gradlew não encontrado"
            exit 1
          }

          test -f android/settings.gradle || {
            echo "❌ android/settings.gradle não encontrado"
            exit 1
          }

          echo "✅ Projeto Android válido."

      # ============================================================
      # 9. Java
      # ============================================================

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ============================================================
      # 10. Gradle Permission
      # ============================================================

      - name: 🔑 Permitir execução do Gradle
        run: |
          chmod +x android/gradlew

      # ============================================================
      # 11. Build Debug
      # ============================================================

      - name: 📱 Compilar Debug APK
        if: env.BUILD_TYPE == 'debug'
        run: |
          cd android

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 12. Build Release
      # ============================================================

      - name: 📱 Compilar Release APK
        if: env.BUILD_TYPE == 'release'
        run: |
          cd android

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 13. Encontrar APK
      # ============================================================

      - name: 🔎 Localizar APK
        id: locate_apk
        run: |

          echo "Procurando APK..."

          find android/app/build/outputs/apk/ \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find android/app/build/outputs/apk/ \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ Nenhum APK encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK_FILE"

          FINAL_NAME="alo-mae-${BUILD_TYPE}.apk"

          cp "$APK_FILE" "$FINAL_NAME"

          APK_SIZE=$(du -h "$FINAL_NAME" | cut -f1)

          echo "apk_path=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 14. Upload Artifact
      # ============================================================

      - name: 🚀 Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: alo-mae-${{ env.BUILD_TYPE }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14

      # ============================================================
      # 15. Summary
      # ============================================================

      - name: 📋 Resumo
        run: |

          echo "## 🎉 APK Alô mãe criado!" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Propriedade | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Aplicação | Alô mãe — Conexão que cuida |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Application ID | \`ao.interlink.alomae\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Build | \`$BUILD_TYPE\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "| APK | \`${{ steps.locate_apk.outputs.apk_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Tamanho | \`${{ steps.locate_apk.outputs.apk_size }}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 📲 Download" >> "$GITHUB_STEP_SUMMARY"

          echo "O APK está disponível na seção **Artifacts** desta execução." >> "$GITHUB_STEP_SUMMARY"
