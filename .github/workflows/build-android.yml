name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 24 with npm cache
      - name: 🟢 Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Step 3: Install Node dependencies cleanly
      - name: 📦 Instalar Dependências Web
        run: |
          npm ci

      # Step 4: Next.js Static Export Build
      - name: 🏗️ Compilar Aplicação Web (Next.js Static Export)
        run: |
          echo "Executando build estático do Next.js..."
          npm run build

      # Step 5: Verify static export output directory
      - name: 🔍 Verificar Diretório 'out/'
        run: |
          if [ ! -d "out" ] || [ ! -f "out/index.html" ]; then
            echo "❌ ERRO: O diretório 'out/' não foi gerado ou está vazio!"
            exit 1
          fi
          echo "✅ Diretório 'out/' validado com sucesso."

      # Step 6: Sync web assets with Capacitor Android project
      - name: 🔄 Sincronizar Capacitor com Android
        run: |
          npx cap sync android

      # Step 7: Verify Android project structure
      - name: 🔍 Verificar Integridade do Projeto Android
        run: |
          test -f android/variables.gradle || { echo "❌ ERRO: android/variables.gradle não encontrado!"; exit 1; }
          test -f android/settings.gradle || { echo "❌ ERRO: android/settings.gradle não encontrado!"; exit 1; }
          test -f android/gradlew || { echo "❌ ERRO: android/gradlew não encontrado!"; exit 1; }
          echo "✅ Todos os arquivos do projeto Android validados com sucesso."

      # Step 8: Set up Java JDK 21 with Gradle Cache
      - name: ☕ Configurar Java JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Step 9: Set execute permission for Gradle wrapper
      - name: 🔑 Dar Permissão de Execução ao Gradle Wrapper
        run: |
          chmod +x android/gradlew

      # Step 10A: Decodificar Keystore para Release (se selecionado)
      - name: 🔐 Configurar Keystore para Release
        if: ${{ (inputs.build_type == 'release') && env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' || secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_BASE64" | base64 -d > android/app/alomae-release.keystore
          echo "✅ Keystore decodificada com sucesso."

      # Step 10B: Compilar APK Debug (padrão ou push)
      - name: 📱 Compilar Android Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Step 10C: Compilar APK Release (se selecionado)
      - name: 📱 Compilar Android Release APK
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/alomae-release.keystore" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Compilando Release APK assinado..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=app/alomae-release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --stacktrace --no-daemon
          else
            echo "Keystore não configurada nos secrets. Compilando Release APK sem assinatura personalizada..."
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      # Step 11: Locate and prepare APK artifact
      - name: 🔎 Localizar e Organizar APK Gerado
        id: locate_apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERRO: Nenhum arquivo APK foi encontrado após o build do Gradle!"
            exit 1
          fi
          echo "APK encontrado em: $APK_FILE"
          BUILD_NAME="${{ inputs.build_type || 'debug' }}"
          FINAL_NAME="alo-mae-${BUILD_NAME}.apk"
          cp "$APK_FILE" "./$FINAL_NAME"
          APK_SIZE=$(du -h "./$FINAL_NAME" | cut -f1)
          echo "apk_path=./$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      # Step 12: Upload APK as GitHub Actions Artifact
      - name: 🚀 Publicar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_apk.outputs.apk_name }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14

      # Step 13: Generate GitHub Actions Summary
      - name: 📋 Resumo da Compilação
        run: |
          echo "## 🎉 Compilação do APK Android Concluída com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Aplicação** | Alô mãe — Conexão que cuida |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application ID** | \`ao.alomaae.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo de Build** | ${{ inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Nome do Arquivo** | \`${{ steps.locate_apk.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamanho** | \`${{ steps.locate_apk.outputs.apk_size }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Como baixar e instalar o APK:" >> $GITHUB_STEP_SUMMARY
          echo "1. Vá até a aba **Actions** neste repositório." >> $GITHUB_STEP_SUMMARY
          echo "2. Clique na execução recente do workflow **Build Android APK**." >> $GITHUB_STEP_SUMMARY
          echo "3. Role até a seção **Artifacts** na parte inferior da página e baixe o seu APK." >> $GITHUB_STEP_SUMMARY

# ==============================================================================
# GUIA DE EXPANSÃO PARA RELEASE / PRODUÇÃO (GOOGLE PLAY AAB / RELEASE APK)
# ==============================================================================
# Quando desejar gerar versões assinadas para a Google Play Store:
# 1. Crie uma keystore localmente:
#    keytool -genkey -v -keystore release.keystore -alias alomae -keyalg RSA -keysize 2048 -validity 10000
# 2. Converta para base64:
#    base64 -w 0 release.keystore > keystore.base64
# 3. Adicione os seguintes Secrets no GitHub (Settings -> Secrets and variables -> Actions):
#    - ANDROID_KEYSTORE_BASE64
#    - ANDROID_KEYSTORE_PASSWORD
#    - ANDROID_KEY_ALIAS
#    - ANDROID_KEY_PASSWORD
# 4. No workflow, inclua o comando:
#    cd android && ./gradlew bundleRelease (para AAB) ou ./gradlew assembleRelease (para APK)
# ==============================================================================
